<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M42,25 h16 v16 h16 v16 h-16 v16 h-16 v-16 h-16 v-16 h16 z' fill='rgba(0, 240, 255, 0.15)'/><polygon points='50,10 90,80 10,80' fill='none' stroke='%2300f0ff' stroke-width='6' stroke-linejoin='round'/><polyline points='0,60 25,60 35,30 50,90 65,45 75,60 100,60' fill='none' stroke='%2339ff14' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <title>Iniciando Sistema Delta-PCT / Mort-Score</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css" />

    <style>
        /* Estilos exclusivos para la pantalla de carga */
        body {
            background-color: #030a16;
            overflow: hidden;
            /* Evita barras de desplazamiento */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .splash-container {
            text-align: center;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .logo-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Anillo giratorio exterior */
        .spinner-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(0, 240, 255, 0.1);
            border-top: 2px solid var(--neon-cyan);
            border-right: 2px solid var(--neon-cyan);
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        /* Anillo giratorio interior inverso */
        .spinner-ring-inner {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 90px;
            height: 90px;
            border: 2px solid rgba(57, 255, 20, 0.1);
            border-bottom: 2px solid var(--neon-green);
            border-left: 2px solid var(--neon-green);
            border-radius: 50%;
            animation: spin-reverse 2s linear infinite;
        }

        /* Ícono central pulsante */
        .logo-icon {
            color: var(--neon-cyan);
            animation: pulse-glow 2s ease-in-out infinite;
        }

        /* Barra de progreso base */
        .loading-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin: 20px 0 10px;
            overflow: hidden;
            position: relative;
        }

        /* Relleno de la barra de progreso */
        .loading-fill {
            height: 100%;
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
            width: 0%;
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        /* Animaciones Keyframes */
        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes spin-reverse {
            100% {
                transform: rotate(-360deg);
            }
        }

        @keyframes pulse-glow {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.8;
                filter: drop-shadow(0 0 2px var(--neon-cyan));
            }

            50% {
                transform: scale(1.1);
                opacity: 1;
                filter: drop-shadow(0 0 10px var(--neon-cyan));
            }
        }

        /* Animación de salida final (desvanecimiento) */
        .fade-out {
            animation: fadeOutSplash 0.5s forwards;
        }

        @keyframes fadeOutSplash {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(1.1);
            }
        }
    </style>
</head>

<body>
    <div class="hud-grid" aria-hidden="true"></div>
    <div class="hud-bg-shapes" aria-hidden="true">
        <svg viewBox="0 0 800 800" width="100%" height="100%">
            <circle cx="400" cy="400" r="300" fill="none" stroke="rgba(0, 240, 255, 0.1)" stroke-width="1"
                stroke-dasharray="10, 8" />
            <circle cx="400" cy="400" r="150" fill="none" stroke="rgba(0, 240, 255, 0.05)" stroke-width="2" />
        </svg>
    </div>

    <div class="splash-container" id="splashScreen">

        <div class="logo-container">
            <div class="spinner-ring"></div>
            <div class="spinner-ring-inner"></div>

            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="55" height="55" class="logo-icon" style="z-index: 2;">
                <path d="M42,25 h16 v16 h16 v16 h-16 v16 h-16 v-16 h-16 v-16 h16 z" fill="rgba(0, 240, 255, 0.15)" />

                <polygon points="50,10 90,80 10,80" fill="none" stroke="var(--neon-cyan)" stroke-width="6"
                    stroke-linejoin="round" />

                <polyline points="0,60 25,60 35,30 50,90 65,45 75,60 100,60" fill="none" stroke="var(--neon-green)"
                    stroke-width="5" stroke-linecap="round" stroksvginejoin="round" />
            </svg>
        </div>

        <h1 class="text-white mb-1" style="font-family: var(--font-hud); font-size: 1.5rem; letter-spacing: 2px;">
            Delta-PCT / Mort-Score
        </h1>
        <h2 class="text-info mb-4" style="font-size: 0.85rem; letter-spacing: 4px; text-transform: uppercase;">
            Sistema Clínico en Línea
        </h2>

        <div class="loading-track">
            <div class="loading-fill" id="loadingBar"></div>
        </div>

        <div class="text-start mt-3">
            <span class="pulse-indicator me-2" style="width: 6px; height: 6px;"></span>
            <span id="terminalText" class="text-white-50" style="font-family: var(--font-hud); font-size: 0.75rem;">
                Inicializando secuencia de arranque...
            </span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            const loadingBar = document.getElementById('loadingBar');
            const terminalText = document.getElementById('terminalText');
            const splashScreen = document.getElementById('splashScreen');

            // Mensajes que simulan la carga del sistema clínico
            const bootSequence = [
                "Verificando integridad de memoria local...",
                "Cargando librerías de algoritmos predictivos...",
                "Sincronizando módulos de gasometría y Kirby...",
                "Calibrando entorno visual HUD...",
                "Estableciendo conexión segura...",
                "Sistema operativo clínico listo."
            ];

            let progress = 0;
            let currentTextIndex = 0;

            // Intervalo para avanzar la barra de progreso
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 5) + 1; // Incremento aleatorio para más realismo

                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    terminalText.textContent = bootSequence[bootSequence.length - 1];
                    terminalText.classList.replace('text-white-50', 'text-neon-cyan');
                    terminalText.style.color = "var(--neon-green)";

                    // Transición de salida y redirección
                    setTimeout(() => {
                        splashScreen.classList.add('fade-out'); // Desvanece el centro
                        document.body.classList.add('fade-out-page'); // Desvanece el fondo (tu CSS original)

                        setTimeout(() => {
                            window.location.href = 'delta1.html'; // Redirección a la app
                        }, 500);
                    }, 600); // Pequeña pausa al llegar al 100%
                }

                loadingBar.style.width = `${progress}%`;

                // Cambiar el texto de la terminal basado en el progreso
                const expectedIndex = Math.floor((progress / 100) * (bootSequence.length - 1));
                if (expectedIndex > currentTextIndex && expectedIndex < bootSequence.length) {
                    currentTextIndex = expectedIndex;
                    terminalText.textContent = bootSequence[currentTextIndex];
                }

            }, 80); // Velocidad de la animación (aprox 2.5 a 3 segundos en total)
        });
    </script>
</body>

</html>
